name: CI and publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run pytest -q
  publish:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'

    steps:
      - name: Send deploy request to LMS
        env:
          LMS_API_KEY: ${{ secrets.LMS_API_KEY }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          HTTP_CODE=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $LMS_API_KEY" \
            -d "{\"image\":\"$IMAGE\",\"repository\":\"$REPOSITORY\"}" \
            https://lms.python-labs.ru/api/deploy-requests)

          if [[ "$HTTP_CODE" != 2* ]]; then
            echo "Deployment failed: HTTP $HTTP_CODE"
            cat response.txt
            exit 1
          fi

          echo "Deploy request created:"
          cat response.txt